name: Windows build

# Compile l'app en .exe Windows pour Sandra (pas de machine Windows en local
# pour builder). Deux façons de récupérer le résultat :
#  - push sur main : le .zip est attaché en "artifact" au run (onglet Actions,
#    disponible ~90 jours, nécessite d'être connecté à GitHub) ;
#  - tag "vX.Y.Z" : en plus, une Release GitHub est créée avec le .zip en
#    pièce jointe (lien stable, pas besoin de compte GitHub pour télécharger).
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - run: flutter pub get

      # env.json n'est jamais commité (clé publique Supabase, mais on suit la
      # convention du projet — voir .gitignore et lib/core/env/env.dart) : on
      # le reconstitue ici à partir des secrets du repo GitHub.
      - name: Écrit env.json depuis les secrets
        shell: bash
        run: |
          cat > env.json <<EOF
          {
            "SUPABASE_URL": "${{ secrets.SUPABASE_URL }}",
            "SUPABASE_PUBLISHABLE_KEY": "${{ secrets.SUPABASE_PUBLISHABLE_KEY }}"
          }
          EOF

      - run: flutter build windows --release --dart-define-from-file=env.json

      - name: Vérifie le build et prépare le .zip
        shell: pwsh
        run: |
          $releaseDir = Get-ChildItem -Path build/windows -Recurse -Directory -Filter Release |
            Where-Object { $_.FullName -match '\\runner\\Release$' } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $releaseDir) {
            Write-Error "Dossier runner/Release introuvable sous build/windows"
            exit 1
          }
          if (-not (Get-ChildItem -Path $releaseDir -Filter *.exe)) {
            Write-Error "Aucun .exe trouvé dans $releaseDir"
            exit 1
          }
          Write-Host "Release dir: $releaseDir"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "$releaseDir\*" -DestinationPath dist/LFAY-CahierJournal-Windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: LFAY-CahierJournal-Windows
          path: dist/LFAY-CahierJournal-Windows.zip
          retention-days: 90

      - name: Release GitHub (uniquement sur tag vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LFAY-CahierJournal-Windows.zip
